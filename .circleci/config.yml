version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.8.1
    steps:
      - checkout
      # Install dependencies first, so the formatting check below runs the
      # prettier version pinned in package.json. If the check runs before
      # `npm ci`, npx fetches whatever prettier npm published most recently,
      # and the build breaks whenever their formatting defaults change.
      - run: npm ci
      - run: npx prettier . --check
      # TODO : do we need caching for dependencies?
      # Build the application
      - run: npm run build
      # TODO: check that style.css matches compiled tailwind
      # Store the build artifacts to be used in the deploy job
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    docker:
      - image: cimg/node:20.8.1
    working_directory: ~/repo
    steps:
      - checkout
      # Attach the workspace with the build artifacts
      - attach_workspace:
          at: .
      # Deploy using the script
      - run: ./scripts/deploy.sh

  # wip is served from Fly (see fly.toml). Fly builds the image itself from
  # the Dockerfile, so this job doesn't need the build workspace.
  deploy-fly:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: curl -fsSL https://fly.io/install.sh | sh -s -- --non-interactive
      - run: ~/.fly/bin/flyctl deploy --remote-only

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          filters:
            branches:
              only:
                - main
          requires:
            - build
      - deploy-fly:
          filters:
            branches:
              only:
                - wip
          requires:
            - build
